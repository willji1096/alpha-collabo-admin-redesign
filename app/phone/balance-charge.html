<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alphacollabo Admin App — 충전하기 (Phone)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="../css/app-mobile.css?v=260812k">
<style>
  /* 페이지 전용 스타일만 (토큰 기반) */
  .charge-balance { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--app-card-shadow); padding: 14px 16px; margin-bottom: 12px; display:flex; align-items: baseline; justify-content: space-between; }
  .charge-balance-label { font-size: var(--fs-sm); color: var(--text-tertiary); font-weight: 500; }
  .charge-balance-value { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .charge-balance-value span { font-size: var(--fs-sm); font-weight: 500; margin-left: 2px; color: var(--text-tertiary); }

  .charge-amount-input { margin-top: var(--space-3); }
  .charge-card { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--app-card-shadow); padding: 14px 16px; margin-bottom: 12px; }
  .charge-card .form-label { margin-bottom: 10px; display: block; }

  .pay-row { display:flex; align-items:flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
  .pay-row:last-child { border-bottom: none; }
  .pay-row input { position: absolute; opacity: 0; pointer-events: none; }
  .pay-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-default); flex-shrink: 0; margin-top: 1px; position: relative; transition: border-color .12s ease; }
  .pay-row input:checked + .pay-radio { border-color: var(--accent); }
  .pay-row input:checked + .pay-radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .pay-row input:focus-visible + .pay-radio { box-shadow: var(--focus-ring); }
  .pay-body { flex: 1; min-width: 0; }
  .pay-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); color: var(--text-primary); }
  .pay-desc { font-size: var(--fs-sm); color: var(--text-tertiary); margin-top: 2px; }

  .charge-summary { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--app-card-shadow); padding: 4px 16px; margin-bottom: 12px; }
  .charge-summary-row { display:flex; align-items:center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-light); font-size: var(--fs-sm); }
  .charge-summary-row:last-child { border-bottom: none; }
  .charge-summary-row .sk { color: var(--text-tertiary); }
  .charge-summary-row .sv { font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .charge-summary-row.is-total .sk { color: var(--text-primary); font-weight: var(--fw-semibold); }
  .charge-summary-row.is-total .sv { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
  .charge-summary-note { font-size: var(--fs-xs); color: var(--text-tertiary); }

  .charge-cta { position: sticky; bottom: -24px; background: var(--bg-surface); border-top: 1px solid var(--border-default); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); margin: 16px -16px 0; }
  .charge-cta .btn { width: 100%; }
</style>
</head>
<body class="app-body-phone">
<div class="app-phone">
  <header class="app-header">
    <button class="app-header-icon" onclick="history.back()" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="app-header-title">충전하기</div>
    <div class="app-header-actions"></div>
  </header>
  <main class="app-body">

    <div class="charge-balance">
      <span class="charge-balance-label">현재 잔액</span>
      <span class="charge-balance-value">3,420,000<span> 원</span></span>
    </div>

    <div class="charge-card">
      <label class="form-label">충전 금액</label>
      <div class="app-filter-chips">
        <label class="app-filter-chip"><input type="radio" name="charge-amt"><span>500,000</span></label>
        <label class="app-filter-chip"><input type="radio" name="charge-amt" checked><span>1,000,000</span></label>
        <label class="app-filter-chip"><input type="radio" name="charge-amt"><span>3,000,000</span></label>
        <label class="app-filter-chip"><input type="radio" name="charge-amt"><span>5,000,000</span></label>
        <label class="app-filter-chip"><input type="radio" name="charge-amt"><span>10,000,000</span></label>
        <label class="app-filter-chip"><input type="radio" name="charge-amt"><span>직접 입력</span></label>
      </div>
      <input class="form-input charge-amount-input" type="text" inputmode="numeric" placeholder="직접 입력 (원)">
    </div>

    <div class="charge-card">
      <label class="form-label">결제 수단</label>
      <label class="pay-row">
        <input type="radio" name="charge-pay" checked>
        <span class="pay-radio"></span>
        <span class="pay-body">
          <span class="pay-title">카드 결제</span>
          <span class="pay-desc">KB국민카드 •••• 1234 · 즉시 충전</span>
        </span>
      </label>
      <label class="pay-row">
        <input type="radio" name="charge-pay">
        <span class="pay-radio"></span>
        <span class="pay-body">
          <span class="pay-title">실시간 계좌이체</span>
          <span class="pay-desc">등록 계좌에서 즉시 출금되어 충전됩니다</span>
        </span>
      </label>
      <label class="pay-row">
        <input type="radio" name="charge-pay">
        <span class="pay-radio"></span>
        <span class="pay-body">
          <span class="pay-title">세금계산서 (법인)</span>
          <span class="pay-desc">입금 확인 후 영업일 기준 1일 이내 반영</span>
        </span>
      </label>
    </div>

    <div class="charge-summary">
      <div class="charge-summary-row">
        <span class="sk">충전 금액</span>
        <span class="sv">1,000,000원</span>
      </div>
      <div class="charge-summary-row">
        <span class="sk">부가세</span>
        <span class="sv charge-summary-note">결제 금액에 포함</span>
      </div>
      <div class="charge-summary-row is-total">
        <span class="sk">충전 후 예상 잔액</span>
        <span class="sv">4,420,000원</span>
      </div>
    </div>

    <div class="charge-cta">
      <button class="btn btn-primary btn-md" onclick="confirmDialog({title:'1,000,000원을 충전할까요?', desc:'선택한 결제 수단으로 즉시 충전됩니다.', tone:'info', okLabel:'충전하기'})">충전하기</button>
    </div>

  </main>
  <nav class="app-tabbar">
    <a class="app-tab" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.3V21h14V9.3"/><path d="M10 21v-6h4v6"/></svg>홈</a>
    <a class="app-tab" href="campaign-calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</a>
    <a class="app-tab" href="list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>신청서관리</a>
    <a class="app-tab" href="influencer-search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>인플루언서</a>
    <a class="app-tab is-active" href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>더보기</a>
  </nav>
</div>

<!-- 확인 다이얼로그 (이 블록 그대로 포함) -->
<div class="app-confirm-root" id="app-confirm" hidden>
  <div class="app-confirm-backdrop" onclick="closeSheet('app-confirm')"></div>
  <div class="app-confirm" role="alertdialog" aria-modal="true" aria-labelledby="app-confirm-title" aria-describedby="app-confirm-desc">
    <div class="app-confirm-icon is-info">
      <svg data-icon="warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <svg data-icon="danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      <svg data-icon="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <svg data-icon="success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2 class="app-confirm-title" id="app-confirm-title" data-confirm-title>진행하시겠습니까?</h2>
    <p class="app-confirm-desc" id="app-confirm-desc" data-confirm-desc></p>
    <div class="app-confirm-actions">
      <button type="button" class="btn btn-secondary btn-md" onclick="closeSheet('app-confirm')">취소</button>
      <button type="button" class="btn btn-primary btn-md" data-confirm-ok>확인</button>
    </div>
  </div>
</div>
<script src="../js/sheets.js?v=260812k"></script>
</body></html>
