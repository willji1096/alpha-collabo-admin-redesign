<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alphacollabo App — 미선정 (Phone)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="../css/app-mobile.css">
</head>
<body class="app-body-phone">
<div class="app-phone">
  <header class="app-header">
    <button class="app-header-icon" onclick="history.back()" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="app-header-title">미선정</div>
    <div class="app-header-actions">
      <button class="app-header-icon" onclick="openSheet('sheet-filter')" aria-label="필터"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button>
    </div>
  </header>
  <main class="app-body">
    <div class="app-pill-tabs">
      <a class="app-pill-tab" href="list.html">신청<span class="count">7</span></a>
      <a class="app-pill-tab" href="list-selection.html">선정<span class="count">1</span></a>
      <a class="app-pill-tab" href="list-inspection.html">검수<span class="count">10</span></a>
      <a class="app-pill-tab" href="list-revision.html">수정<span class="count">1</span></a>
      <a class="app-pill-tab" href="list-completed.html">완료<span class="count">2</span></a>
      <a class="app-pill-tab is-active" href="list-unselected.html">미선정<span class="count">1</span></a>
      <a class="app-pill-tab" href="list-cancel-influencer.html">취소</a>
    </div>
    <div class="app-list-toolbar">
      <div class="app-list-toolbar-count">미선정 <b style="color:var(--text-primary)">1</b>건</div>
    </div>
    <div class="app-section is-flush">
      <a class="app-list-card" href="influencer-detail.html" style="border-bottom:none">
        <img class="app-list-card-thumb" src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=120&h=120&fit=crop" alt="">
        <div class="app-list-card-body">
          <div class="app-card-toprow">
            <span class="c-country-code">RU</span><span class="app-card-id">#272</span>
            <span class="badge badge-sm" style="margin-left:auto; background:var(--neutral-100); color:var(--text-tertiary)">미선정</span>
          </div>
          <div class="app-list-card-title">봄 멀티밤 인스타 리뷰</div>
          <div class="app-list-card-subline">1766993644 · glowlab_kr</div>
          <div class="app-list-card-meta">
            <span>yuki_tokyo</span><span class="app-list-card-meta-sep"></span>
            <span class="sns-ico tag-instagram app-sns-ico-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/></svg></span>
          </div>
          <div class="app-list-card-foot">
            <span class="app-list-card-stat">신청 <b>2026-01-06</b></span>
            <button type="button" class="app-card-action" aria-label="yuki_tokyo #272 상세 보기">상세</button>
          </div>
        </div>
      </a>
    </div>
  </main>
  <nav class="app-tabbar">
    <a class="app-tab" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>홈</a>
    <a class="app-tab is-active" href="list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>신청서관리</a>
    <a class="app-tab" href="influencer-search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>인플루언서</a>
    <a class="app-tab" href="campaign-calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</a>
    <a class="app-tab" href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>더보기</a>
  </nav>
</div>
<div class="app-sheet-root" id="sheet-filter" hidden>
  <div class="app-sheet-backdrop" onclick="closeSheet('sheet-filter')"></div>
  <div class="app-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-filter-title">
    <div class="app-sheet-handle"></div>
    <div class="app-sheet-head"><div class="app-sheet-head-titles"><h2 class="app-sheet-title" id="sheet-filter-title">필터</h2></div><button class="app-sheet-close" onclick="closeSheet('sheet-filter')" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="app-sheet-body">
      <div class="app-filter-group"><div class="app-filter-label">캠페인 유형</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="p-type" checked><span>전체</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-type"><span>방문형</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-type"><span>배송형</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-type"><span>리뷰형</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">국가</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="checkbox"><span>일본</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>한국</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>중국</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>러시아</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">채널</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="checkbox"><span>인스타그램</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>유튜브</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>틱톡</span></label>
          <label class="app-filter-chip"><input type="checkbox"><span>샤오훙슈</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">기간</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="p-period" checked><span>전체</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-period"><span>이번 주</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-period"><span>이번 달</span></label>
          <label class="app-filter-chip"><input type="radio" name="p-period"><span>직접 지정</span></label>
        </div></div>
    </div>
    <div class="app-sheet-foot">
      <button class="btn btn-ghost btn-md btn-reset" onclick="document.querySelectorAll('#sheet-filter input').forEach(function(c){c.checked=false})">초기화</button>
      <button class="btn btn-primary btn-md btn-grow" onclick="closeSheet('sheet-filter')">적용</button>
    </div>
  </div>
</div>
<script src="../js/sheets.js"></script>
</body></html>
