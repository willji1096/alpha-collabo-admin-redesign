<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alphacollabo App — 로그인 (Phone)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="../css/app-mobile.css">
<style>
  body { background: var(--bg-surface); }
  .login-page { padding: 0 24px 24px; min-height: 100dvh; display:flex; flex-direction:column; position: relative }
  .login-lang { position: absolute; top: 18px; right: 24px; font-size: var(--fs-sm); color: var(--text-tertiary); padding: 6px 12px; border: 1px solid var(--border-default); border-radius: 999px; background: var(--bg-surface) }
  .login-brand { padding-top: 28px; margin-bottom: 40px }
  .login-title { font-size:var(--fs-2xl); font-weight: 700; letter-spacing: -0.4px; line-height: 1.3; margin-bottom: 28px; text-align: left }
  .login-form .form-group { margin-bottom: 14px }
  .login-form .form-label { display:block; font-size:var(--fs-base); font-weight: 500; color: var(--text-primary); margin-bottom: 6px }
  .login-form .form-input { width: 100%; height: 48px; padding: 0 16px; font-size:var(--fs-lg); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-primary); font-family: inherit }
  .login-form .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light) }
  .login-form .pw-wrap { position: relative }
  .login-form .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 4px; display: inline-flex }
  .login-options { display:flex; align-items:center; justify-content:space-between; margin: 16px 0 24px }
  .login-options label { font-size:var(--fs-base); color: var(--text-secondary); display:flex; align-items:center; gap: 6px }
  .login-options a { font-size:var(--fs-base); color: var(--text-link); text-decoration: none }
  .login-btn { width: 100%; height: 52px; background: var(--accent); color: var(--text-on-accent); font-size:var(--fs-lg); font-weight: 600; border: none; border-radius: var(--radius-md); cursor: pointer }
  .login-btn:hover { background: var(--accent-hover) }
  .login-alert { display:flex; gap:8px; align-items:flex-start; padding: 10px 12px; background: var(--status-error-bg); border: 1px solid var(--status-error-border); border-radius: var(--radius-md); margin-bottom: 16px; font-size:var(--fs-base); color: var(--status-error-strong) }
  .login-alert svg { flex-shrink:0; margin-top:1px }
  .login-foot { margin-top: auto; font-size:var(--fs-sm); color: var(--text-disabled); text-align:center; padding-top: 32px }
  .login-demo-hint { margin-top: 10px; padding: 9px 12px; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size:var(--fs-sm); color: var(--text-tertiary); line-height: 1.5 }
  .login-demo-hint b { color: var(--text-secondary); font-variant-numeric: tabular-nums }
  .login-alert[hidden] { display: none; }
  .login-logo { height: 48px; width: auto; display: block; }
</style>
</head>
<body class="app-body-phone">
<div class="login-page">

  <span class="login-lang">한국어</span>

  <div class="login-brand">
    <img class="login-logo" src="../../logo/alpha-collabo-black.svg" alt="알파콜라보">
  </div>

  <h1 class="login-title">로그인</h1>

  <!-- 에러 상태 (기본 숨김 · 검증 실패 시 hidden 제거) -->
  <div class="login-alert" hidden>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8.5M8 10.5V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
  </div>

  <form class="login-form">
    <div class="form-group">
      <label class="form-label" for="username">아이디</label>
      <input class="form-input" id="username" type="text" placeholder="관리자 아이디를 입력하세요" value="glowlab_kr">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">비밀번호</label>
      <div class="pw-wrap">
        <input class="form-input" id="password" type="password" placeholder="비밀번호를 입력하세요" style="padding-right: 44px">
        <button type="button" class="pw-toggle" aria-label="비밀번호 보기"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9C1.5 9 4 3.75 9 3.75C14 3.75 16.5 9 16.5 9C16.5 9 14 14.25 9 14.25C4 14.25 1.5 9 1.5 9Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
      <div class="login-demo-hint">데모 계정 — 아이디: <b>glowlab_kr</b> / 비밀번호: <b>alpha2025</b></div>
    </div>

    <div class="login-options">
      <label><input type="checkbox" checked> 아이디 저장</label>
      <a href="#">비밀번호 찾기</a>
    </div>

    <button type="submit" class="login-btn">로그인</button>
  </form>

  <div class="login-foot">
    Copyright © 2026 Alphacollabo.<br>All Rights Reserved.
  </div>
</div>
<script>
  (function () {
    var form = document.querySelector('.login-form');
    var alertBox = document.querySelector('.login-alert');
    var idInput = document.getElementById('username');
    var pwInput = document.getElementById('password');
    var toggle = document.querySelector('.pw-toggle');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = idInput.value.trim();
      var pw = pwInput.value;
      if (id === 'glowlab_kr' && pw === 'alpha2025') {
        window.location.href = 'dashboard.html';
      } else {
        alertBox.hidden = false;
        pwInput.focus();
      }
    });

    toggle.addEventListener('click', function () {
      var hidden = pwInput.type === 'password';
      pwInput.type = hidden ? 'text' : 'password';
      toggle.setAttribute('aria-label', hidden ? '비밀번호 숨기기' : '비밀번호 보기');
    });
  })();
</script>
</body></html>
