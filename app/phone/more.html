<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alphacollabo App — 더보기 (Phone)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="../css/app-mobile.css">
<style>
  /* 더보기 — 차분/무채색 기반, 카드 통합 */

  /* 프로필 카드 — 읽기전용 (계정 발급은 알파콜라보) */
  .m-profile {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-1, 0 1px 2px rgba(0,0,0,0.04));
  }
  .m-avt {
    width: 52px; height: 52px;
    border-radius: var(--radius-md);
    background: var(--bg-inverse);
    color: var(--text-inverse);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .m-profile-body { flex: 1; min-width: 0; }
  .m-name-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 3px;
  }
  .m-name { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.3px; }
  .m-role-chip {
    font-size: var(--fs-xs);
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    border: 1px solid var(--border-light);
    padding: 1px 7px;
    border-radius: var(--radius-full);
    flex-shrink: 0;
  }
  .m-email {
    font-size: var(--fs-sm);
    color: var(--text-tertiary);
    line-height: 1.4;
    word-break: keep-all;
  }

  /* 잔액 — 흰 카드 + 라지 텍스트 + 충전 액션 */
  .m-balance {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-1, 0 1px 2px rgba(0,0,0,0.04));
  }
  .m-balance-label {
    font-size: var(--fs-sm);
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .m-balance-value {
    font-size: var(--fs-3xl);
    font-weight: 700;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .m-balance-value small {
    font-size: var(--fs-lg);
    font-weight: 500;
    color: var(--text-tertiary);
    margin-left: 4px;
  }
  .m-balance-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .m-balance-charge {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent);
    color: var(--text-inverse);
    font-size: var(--fs-base);
    font-weight: 600;
    padding: 10px;
    border-radius: var(--radius-md);
    text-decoration: none;
  }
  .m-balance-charge svg { width: 16px; height: 16px; }
  .m-balance-detail {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-default);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: var(--fs-base);
    font-weight: 600;
    padding: 10px;
    border-radius: var(--radius-md);
    text-decoration: none;
  }
  .m-balance-foot {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
    font-size: var(--fs-sm);
    color: var(--text-tertiary);
  }
  .m-balance-foot b { color: var(--text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── 통합 카드 — 모든 row를 하나의 카드 안에 ── */
  .m-section {
    margin-bottom: 20px;
  }
  .m-section-label {
    font-size: var(--fs-sm);
    color: var(--text-tertiary);
    font-weight: 600;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .m-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .m-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-light);
    font-size:var(--fs-base);
    font-weight: 500;
  }
  .m-row:last-child { border-bottom: none; }
  .m-row:hover { background: var(--bg-hover); }
  .m-row-icon {
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .m-row-icon svg { width: 20px; height: 20px; }
  .m-row-label { flex: 1; }
  .m-row-aside {
    font-size: var(--fs-sm);
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .m-row-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
  .m-row-count {
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-size:var(--fs-sm);
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .m-row-arrow {
    color: var(--text-disabled);
    flex-shrink: 0;
  }
  .m-row-arrow svg { width: 16px; height: 16px; }

  .m-row.is-danger { color: var(--status-error); }
  .m-row.is-danger .m-row-icon { color: var(--status-error); }

  .m-footer {
    text-align: center;
    padding: 8px 0 32px;
    font-size:var(--fs-sm);
    color: var(--text-disabled);
  }
</style>
</head>

    <!-- 사이트관리 ──── -->
    <div class="m-section">
      <div class="m-section-label">사이트관리</div>

        <a class="m-row" href="notice.html">

  </main>
