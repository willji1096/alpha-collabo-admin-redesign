<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alphacollabo App — 공지사항 (Phone)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="../css/app-mobile.css">
<style>
  .ntc-row{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-light);text-decoration:none;color:inherit;cursor:pointer}
  .ntc-row:hover{background:var(--bg-hover)}
  .ntc-tag{flex-shrink:0;font-size:var(--fs-sm);font-weight:600;padding:3px 10px;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent-emphasis);min-width:44px;text-align:center}
  .ntc-tag.event{background:var(--status-info-bg);color:var(--status-info-strong)}
  .ntc-body{flex:1;min-width:0}
  .ntc-title{font-size:var(--fs-lg);font-weight: 600;line-height:1.4;color:var(--text-primary);margin-bottom:4px}
  .ntc-meta{font-size:var(--fs-sm);color:var(--text-tertiary)}
</style>
</head>
<body class="app-body-phone">
<div class="app-phone">
  <header class="app-header">
    <button class="app-header-icon" onclick="history.back()" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="app-header-title">공지사항</div>
    <div class="app-header-actions">
      <button class="app-header-icon" onclick="openSheet('sheet-search')" aria-label="검색·필터"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
  </header>
  <main class="app-body">
    <div class="app-pill-tabs">
      <a class="app-pill-tab is-active" href="#">전체<span class="count">1</span></a>
      <a class="app-pill-tab" href="#">공지<span class="count">1</span></a>
      <a class="app-pill-tab" href="#">이벤트<span class="count">0</span></a>
    </div>
    <div class="app-list-toolbar">
      <div class="app-list-toolbar-count">전체 <b style="color:var(--text-primary)">1</b>건 · 검색 <b style="color:var(--text-primary)">1</b>건</div>
      <div class="app-list-toolbar-count" style="color:var(--text-tertiary)">등록일자 ↑</div>
    </div>
    <div class="app-section">
      <a class="ntc-row" href="#" style="border-bottom:none">
        <span class="ntc-tag">공지</span>
        <div class="ntc-body">
          <div class="ntc-title">입점업체 공지사항</div>
          <div class="ntc-meta">2025-01-03 · 조회 11</div>
        </div>
      </a>
    </div>
  </main>
  <nav class="app-tabbar">
    <a class="app-tab" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>홈</a>
    <a class="app-tab" href="list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>신청서관리</a>
    <a class="app-tab" href="influencer-search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>인플루언서</a>
    <a class="app-tab" href="campaign-calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</a>
    <a class="app-tab is-active" href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>더보기</a>
  </nav>
</div>
<div class="app-sheet-root" id="sheet-search" hidden>
  <div class="app-sheet-backdrop" onclick="closeSheet('sheet-search')"></div>
  <div class="app-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-search-title">
    <div class="app-sheet-handle"></div>
    <div class="app-sheet-head"><div class="app-sheet-head-titles"><h2 class="app-sheet-title" id="sheet-search-title">검색 · 필터</h2></div><button class="app-sheet-close" onclick="closeSheet('sheet-search')" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="app-sheet-body">
      <div class="app-search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" placeholder="제목 또는 내용 검색">
      </div>
      <div class="app-filter-group"><div class="app-filter-label">검색 항목</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="ntc-field" checked><span>전체</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-field"><span>제목</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-field"><span>내용</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">분류</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="ntc-cat" checked><span>전체</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-cat"><span>공지</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-cat"><span>이벤트</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">등록일자 기간</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="ntc-period" checked><span>전체</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-period"><span>오늘</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-period"><span>7일</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-period"><span>15일</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-period"><span>1개월</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-period"><span>3개월</span></label>
        </div></div>
      <div class="app-filter-group"><div class="app-filter-label">정렬</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="ntc-sort" checked><span>등록일자 오름차순</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-sort"><span>등록일자 내림차순</span></label>
        </div></div>
      <div class="app-filter-group" style="margin-bottom:0"><div class="app-filter-label">페이지당 표시</div><div class="app-filter-chips">
          <label class="app-filter-chip"><input type="radio" name="ntc-page" checked><span>15개</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-page"><span>30개</span></label>
          <label class="app-filter-chip"><input type="radio" name="ntc-page"><span>50개</span></label>
        </div></div>
    </div>
    <div class="app-sheet-foot"><button class="btn btn-primary btn-md btn-grow" onclick="closeSheet('sheet-search')">검색</button></div>
  </div>
</div>
<script src="../js/sheets.js"></script>
</body></html>
